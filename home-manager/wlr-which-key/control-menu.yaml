font: monospace
background: "#000000bf"
color: "#f0cabf"
border: "#f0cabf"
separator: " ➜ "
border_width: 2
corner_r: 7
padding: 16
rows_per_column: 4

menu:
  - key: "c"
    desc: "[Split] wl-kbptr"
    cmd: wl-kbptr -o modes=tile,split
  - key: "g"
    desc: "[Float] Click left"
    cmd: wl-kbptr -o modes=floating,click -o mode_click.button=left
  - key: "h"
    desc: "[Float] Click right"
    cmd: wl-kbptr -o modes=floating,click -o mode_click.button=right
  - key: "b"
    desc: "[Float] Click middle"
    cmd: wl-kbptr -o modes=floating,click -o mode_click.button=middle
  - key: "z"
    desc: "[Waybar] Reload"
    cmd: pkill -SIGUSR2 waybar
  - key: "Z"
    desc: "[Waybar] Toggle visibility"
    cmd: pkill -SIGUSR1 waybar
  - key: "u"
    desc: "Logout menu"
    # cmd: wlogout --buttons-per-row 6
    # cmd: wleave --buttons-per-row 6
    cmd: wlogout-qs
