# theme = "ayu_dark"
theme = "rose_pine_murk"

[editor]
line-number = "relative"
bufferline = "multiple"
true-color = true
color-modes = true
idle-timeout = 50
completion-timeout = 5
completion-trigger-len = 1
# popup-border = "all"
jump-label-alphabet = "asdf;lkjweroiughtycvbmn"
end-of-line-diagnostics = "hint"

[editor.file-picker]
hidden = false

[editor.lsp]
display-messages = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true
character = "┆"

[editor.statusline]
left = [ "mode", "spinner", "spacer", "version-control", "file-name", "read-only-indicator", "file-modification-indicator" ]
center = [ "diagnostics", "register" ]
right = [ "selections", "primary-selection-length", "separator", "position", "position-percentage", "spacer", "separator", "file-encoding", "file-line-ending", "file-type" ]
separator = "┆"

[editor.inline-diagnostics]
cursor-line = "warning"

[editor.whitespace.render]
tab = "all"
nbsp = "all"

[keys.normal]
# Rationale: we have `miw` for selecting a word, and W, B, E for navigating at comparable speed
w = 'move_next_sub_word_start'
b = 'move_prev_sub_word_start'
e = 'move_next_sub_word_end'

esc = ["collapse_selection", "keep_primary_selection"]
ret = "goto_word"
a = ["move_char_right", "insert_mode"]

C-r = ":reload"

# C-j = "save_selection"
"'" = "save_selection"
S-tab = "jump_backward"

"up" = ["move_visual_line_up", "scroll_up"]
"down" = ["move_visual_line_down", "scroll_down"]

[keys.normal.space]
x = ":buffer-close"
X = ":buffer-close!"
A-x = ":buffer-close-others"
"." = "file_picker_in_current_buffer_directory"

[keys.normal.space.l]
c = [":write!", ":run-shell-command zellij run --floating -- just check"]
b = [":write!", ":run-shell-command zellij run --floating -- just build"]
r = [":write!", ":run-shell-command zellij run --floating -- just run"]
t = [":write!", ":run-shell-command zellij run --floating -- just test"]
k = [":write!", ":run-shell-command zellij run --floating -- just --choose"]

d = [":hsplit-new", ":lang diff", ":insert-output git diff", "flip_selections"]

[keys.normal.space.t]
s = ":toggle-option soft-wrap.enable"
i = ":toggle-option file-picker.ignore"
h = ":toggle-option lsp.display-inlay-hints"

[keys.normal.space.t.l]
c = ":toggle-option cursorline"
0 = ":set-option rulers []"
1 = ":set-option rulers [80]"
2 = ":set-option rulers [80,120]"

[keys.normal.space.w]
c = ":config-open"
r = ":config-reload"

# Duplicate from [keys.normal.space.w] due to the lack of window mode remapping
[keys.normal.C-w]
c = ":config-open"
r = ":config-reload"

[keys.select]
w = 'extend_next_sub_word_start'
b = 'extend_prev_sub_word_start'
e = 'extend_next_sub_word_end'

# esc = ["collapse_selection", "keep_primary_selection", "normal_mode"]
# "C-c" = ["collapse_selection", "keep_primary_selection"]

[keys.select.space]
x = ":buffer-close"
X = ":buffer-close!"
A-x = ":buffer-close-others"
"." = "file_picker_in_current_buffer_directory"
