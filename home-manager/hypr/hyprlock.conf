# $font = Sans
$font = Monospace

general {
  hide_cursor = true
  ignore_empty_input = true
}

# Swaylock-like input indicator
input-field {
  size = 180, 60
  hide_input = true
  outline_thickness = 5
  inner_color = rgba(0, 0, 0, 0.0)
}

# # Dot-masked text field
